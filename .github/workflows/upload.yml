name: upload
run-name: upload ${{ inputs.slug }}
# Uploads a finished episode from a build run's artifact (out-<slug>): the pilot, or an episode
# whose release job could not upload (doubt about the channel, no token yet). Channel list read in
# full first, id committed at once, captions de + en, thumbnail. Run it from main; from dev it only
# says what it would do (DRY_RUN).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: episode slug
        required: true
      run_id:
        description: the episode-de run whose out-<slug> artifact holds the files
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: upload
  cancel-in-progress: false
env:
  PYTHONUTF8: 1
  SLUG: ${{ inputs.slug }}
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
      DRY_RUN: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - uses: actions/download-artifact@v4
        with:
          name: out-${{ inputs.slug }}
          path: episodes/${{ inputs.slug }}/out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python automation/release.py record "$SLUG"

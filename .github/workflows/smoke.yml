name: smoke
run-name: smoke ${{ inputs.ref || github.ref_name }}
# Code reaches main only through here (owner: dev -> smoke -> main): work is pushed to dev,
# scripts/smoke_de.py runs the chain on tiny inputs, and only a passing run merges dev into main.
# A failure mails nobody (no mail to the owner): the run stays red in the Actions list.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: the branch to test (anything but dev is tested, never promoted)
        default: dev
permissions:
  contents: write
concurrency:
  group: smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: 1
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'dev' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q numpy pillow soundfile google-api-python-client google-auth
      - run: python scripts/smoke_de.py
      - name: Promote dev to main
        if: (inputs.ref || 'dev') == 'dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main dev
          git reset -q --hard
          git checkout -q -B main origin/main
          git merge --no-edit origin/dev
          for i in 1 2 3 4 5; do git push origin main && break; sleep $((i * 8)); git fetch -q origin main && git merge --no-edit origin/main; done
          git push origin main:dev || true

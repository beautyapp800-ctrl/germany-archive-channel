name: watchdog
# Keeps the weekly Sunday 17:00 Berlin schedule going: reruns what failed (never on a quota/429 stop, one attempt
# per topic per day), keeps 2 videos ahead plus 1-2 emergency reserve, schedules a reserve into an empty slot under
# 24 h away, uploads what is built but not on YouTube, commits a daily heartbeat. One run checks every 15 minutes for
# almost six hours and starts its successor; the schedule only restarts the chain if it ever breaks.
# No mail is sent to the owner. The minutes (17, 47) are chosen to stay off the other channels' crons.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "true = one pass and stop (a test), otherwise the 5.6 h loop that starts its successor"
        default: "false"
permissions:
  contents: write
  actions: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
      # builds start only once both keys exist
      KEYS_READY: ${{ secrets.GROQ_API_KEY_AR != '' && secrets.GEMINI_API_KEY_AR != '' }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - name: Watch every 15 minutes, then hand over
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 5*3600 + 40*60 ))
          if [ "${{ inputs.once }}" = "true" ]; then end=$(( $(date +%s) + 1 )); fi
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; git reset -q --hard origin/main; }
            python automation/watchdog_de.py || echo "watchdog pass failed: $?"
            commit=$(grep -o "^commit=.*" "$GITHUB_OUTPUT" 2>/dev/null | tail -1 | cut -d= -f2)
            for f in state/watchdog.json state/episodes.json topics/queue.json state/quota_hold.json; do git add "$f" 2>/dev/null || true; done
            [ "$commit" = "true" ] && git add state/heartbeat.json
            if ! git diff --cached --quiet; then
              git commit -q -m "watchdog: state $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; sleep $((i * 8)); done
            fi
            : > "$GITHUB_OUTPUT"
            [ "${{ inputs.once }}" = "true" ] && break
            sleep 900
          done
          [ "${{ inputs.once }}" = "true" ] || gh workflow run watchdog.yml --repo ${{ github.repository }}
